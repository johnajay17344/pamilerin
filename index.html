<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn With Jay &mdash; Mathematics: Indices Quiz</title>
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#101B33;
    --gold:#C9A227;
    --paper:#FAF8F2;
    --card:#FFFFFF;
    --ink:#22283A;
    --muted:#6B7280;
    --correct:#1E8E5A;
    --correct-bg:#E6F5EC;
    --wrong:#C6432B;
    --wrong-bg:#FBEAE6;
    --line:#E4E0D3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
  }
  .top-bar{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding: 28px 20px 22px;
    text-align:center;
    border-bottom: 4px solid var(--gold);
  }
  .top-bar h1{
    margin:0;
    font-size: 28px;
    letter-spacing: 0.5px;
    font-weight:700;
  }
  .top-bar p{
    margin:6px 0 0;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 13.5px;
    color:#CBD3E1;
  }
  .meta-strip{
    max-width: 760px;
    margin: 18px auto 0;
    padding: 0 20px;
    display:flex;
    flex-wrap:wrap;
    gap: 10px 24px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    justify-content:center;
  }
  .meta-strip span b{ color:var(--navy); }

  .scoreboard{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 18px;
    font-family: Helvetica, Arial, sans-serif;
  }
  .score-pill{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight:600;
    color: var(--navy);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .score-pill span{ color: var(--gold); font-weight:800; }

  .progress-track{
    max-width: 760px;
    margin: 0 auto;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: var(--gold);
    transition: width .25s ease;
  }

  .container{
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 20px 90px;
  }

  .qcard{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(20,20,40,0.05);
  }
  .qhead{
    display:flex;
    align-items:baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .qnum{
    font-family: Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size: 12.5px;
    color: #fff;
    background: var(--navy);
    padding: 3px 9px;
    border-radius: 5px;
    flex-shrink:0;
  }
  .qtext{
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
  }
  .qtext sup{ font-size: 65%; }

  .options{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width:520px){
    .options{ grid-template-columns: 1fr; }
  }
  .opt{
    font-family: Helvetica, Arial, sans-serif;
    text-align:left;
    border: 1.5px solid var(--line);
    background: #FDFCF9;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 10px;
    transition: border-color .15s ease, background .15s ease, transform .08s ease;
    color: var(--ink);
  }
  .opt:hover:not(:disabled){
    border-color: var(--navy);
    transform: translateY(-1px);
  }
  .opt:disabled{ cursor:default; }
  .opt .lab{
    font-weight:700;
    color: var(--navy);
    border: 1.5px solid var(--navy);
    border-radius: 50%;
    width: 22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px;
    flex-shrink:0;
  }
  .opt sup{ font-size: 70%; }
  .opt.is-correct{
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .opt.is-correct .lab{ background:var(--correct); border-color:var(--correct); color:#fff; }
  .opt.is-wrong{
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .opt.is-wrong .lab{ background:var(--wrong); border-color:var(--wrong); color:#fff; }

  .feedback{
    margin-top: 10px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight:600;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ color: var(--correct); }
  .feedback.wrong{ color: var(--wrong); }

  .finish-wrap{
    text-align:center;
    margin-top: 24px;
  }
  .finish-btn{
    font-family: Helvetica, Arial, sans-serif;
    background: var(--navy);
    color:#fff;
    border:none;
    padding: 13px 34px;
    border-radius: 8px;
    font-size: 15px;
    font-weight:700;
    cursor:pointer;
    letter-spacing: 0.3px;
  }
  .finish-btn:disabled{
    background: #A7ADBB;
    cursor:not-allowed;
  }

  .result-overlay{
    position: fixed; inset:0;
    background: rgba(16,27,51,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .result-overlay.show{ display:flex; }
  .result-card{
    background:#fff;
    border-radius: 14px;
    max-width: 420px;
    width:100%;
    padding: 32px 28px;
    text-align:center;
    border-top: 6px solid var(--gold);
  }
  .result-card h2{
    margin: 0 0 4px;
    color: var(--navy);
    font-size: 22px;
  }
  .result-score{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 46px;
    font-weight:800;
    color: var(--navy);
    margin: 14px 0 2px;
  }
  .result-pct{
    font-family: Helvetica, Arial, sans-serif;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .result-remark{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .result-actions button{
    font-family: Helvetica, Arial, sans-serif;
    background: var(--gold);
    color: var(--navy-deep);
    border:none;
    padding: 11px 26px;
    border-radius: 8px;
    font-weight:700;
    cursor:pointer;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <h1>LEARN WITH JAY</h1>
    <p>Excellence in Learning &nbsp;|&nbsp; Building Strong Foundations</p>
  </div>
  <div class="meta-strip">
    <span><b>Class:</b> SS1</span>
    <span><b>Subject:</b> Mathematics</span>
    <span><b>Topic:</b> Indices</span>
    <span><b>Questions:</b> 40</span>
  </div>

  <div class="scoreboard">
    <div class="score-pill">Answered: <span id="answeredCount">0</span>/40</div>
    <div class="score-pill">Score: <span id="scoreCount">0</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="container" id="quizContainer"></div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <h2>Examination Complete</h2>
      <div class="result-score" id="resultScore">0 / 40</div>
      <div class="result-pct" id="resultPct"></div>
      <div class="result-remark" id="resultRemark"></div>
      <div class="result-actions">
        <button onclick="location.reload()">Retake Exam</button>
      </div>
    </div>
  </div>

<script>
const DATA = [
{"num": 1, "question": "Find 23 mod 5", "options": {"A": "3", "B": "4", "C": "2", "D": "5"}, "answer": "A", "level": "easy"},
{"num": 2, "question": "Find 47 mod 8", "options": {"A": "5", "B": "7", "C": "6", "D": "8"}, "answer": "B", "level": "easy"},
{"num": 3, "question": "Find 56 mod 7", "options": {"A": "0", "B": "1", "C": "2", "D": "3"}, "answer": "A", "level": "easy"},
{"num": 4, "question": "Find 31 mod 6", "options": {"A": "4", "B": "5", "C": "1", "D": "2"}, "answer": "B", "level": "easy"},
{"num": 5, "question": "Find 100 mod 9", "options": {"A": "2", "B": "1", "C": "3", "D": "4"}, "answer": "B", "level": "easy"},
{"num": 6, "question": "Find 65 mod 12", "options": {"A": "5", "B": "4", "C": "6", "D": "3"}, "answer": "A", "level": "easy"},
{"num": 7, "question": "Find (18 + 27) mod 13", "options": {"A": "6", "B": "5", "C": "7", "D": "4"}, "answer": "B", "level": "medium"},
{"num": 8, "question": "Find (45 - 22) mod 8", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "answer": "C", "level": "medium"},
{"num": 9, "question": "Find (12 × 5) mod 7", "options": {"A": "2", "B": "3", "C": "1", "D": "4"}, "answer": "C", "level": "medium"},
{"num": 10, "question": "If a ≡ 3 (mod 7) and b ≡ 5 (mod 7), find (a + b) mod 7", "options": {"A": "1", "B": "0", "C": "2", "D": "8"}, "answer": "A", "level": "medium"},
{"num": 11, "question": "If x ≡ 4 (mod 11), which is true?", "options": {"A": "x = 15", "B": "x = 26", "C": "x = 20", "D": "x = 18"}, "answer": "A", "level": "medium"},
{"num": 12, "question": "Find 7^2 mod 10", "options": {"A": "9", "B": "49", "C": "8", "D": "1"}, "answer": "A", "level": "medium"},
{"num": 13, "question": "What is 2^5 mod 11?", "options": {"A": "10", "B": "32", "C": "9", "D": "21"}, "answer": "A", "level": "medium"},
{"num": 14, "question": "Find 3^4 mod 13", "options": {"A": "81", "B": "3", "C": "9", "D": "12"}, "answer": "C", "level": "medium"},
{"num": 15, "question": "If a ≡ 6 (mod 8), what is 2a mod 8?", "options": {"A": "12", "B": "4", "C": "6", "D": "2"}, "answer": "B", "level": "medium"},
{"num": 16, "question": "Find (35 × 22) mod 12", "options": {"A": "6", "B": "10", "C": "8", "D": "4"}, "answer": "B", "level": "hard"},
{"num": 17, "question": "Find 2^10 mod 7", "options": {"A": "2", "B": "4", "C": "1", "D": "6"}, "answer": "B", "level": "hard"},
{"num": 18, "question": "If 5x ≡ 3 (mod 7), find x", "options": {"A": "2", "B": "3", "C": "4", "D": "5"}, "answer": "D", "level": "hard"},
{"num": 19, "question": "What is (-15) mod 8?", "options": {"A": "1", "B": "7", "C": "5", "D": "3"}, "answer": "A", "level": "hard"},
{"num": 20, "question": "Find 3^5 mod 11", "options": {"A": "1", "B": "243", "C": "9", "D": "7"}, "answer": "A", "level": "hard"},
{"num": 21, "question": "If a ≡ 2 (mod 5) and b ≡ 3 (mod 5), find ab mod 5", "options": {"A": "6", "B": "1", "C": "0", "D": "4"}, "answer": "B", "level": "medium"},
{"num": 22, "question": "Find the remainder when 89 is divided by 13", "options": {"A": "11", "B": "10", "C": "12", "D": "9"}, "answer": "B", "level": "easy"},
{"num": 23, "question": "Express 54 mod 7 in simplest form", "options": {"A": "5", "B": "6", "C": "7", "D": "4"}, "answer": "A", "level": "easy"},
{"num": 24, "question": "Find (99 + 101) mod 20", "options": {"A": "0", "B": "20", "C": "10", "D": "5"}, "answer": "A", "level": "medium"},
{"num": 25, "question": "If n ≡ 7 (mod 9), which value could n be?", "options": {"A": "20", "B": "25", "C": "16", "D": "18"}, "answer": "B", "level": "medium"},
{"num": 26, "question": "Find 2^3 + 3^2 mod 11", "options": {"A": "6", "B": "7", "C": "8", "D": "5"}, "answer": "A", "level": "medium"},
{"num": 27, "question": "What is the last digit of 7^20? (Hint: use mod 10)", "options": {"A": "1", "B": "7", "C": "9", "D": "3"}, "answer": "A", "level": "hard"},
{"num": 28, "question": "Find 5^6 mod 13", "options": {"A": "12", "B": "1", "C": "8", "D": "5"}, "answer": "B", "level": "hard"},
{"num": 29, "question": "If 3x ≡ 9 (mod 12), find x", "options": {"A": "3", "B": "6", "C": "9", "D": "0"}, "answer": "A", "level": "hard"},
{"num": 30, "question": "Find (7^2 - 5^2) mod 6", "options": {"A": "0", "B": "1", "C": "2", "D": "3"}, "answer": "A", "level": "medium"},
{"num": 31, "question": "What day of the week is 100 days from Monday?", "options": {"A": "Monday", "B": "Tuesday", "C": "Saturday", "D": "Sunday"}, "answer": "A", "level": "hard"},
{"num": 32, "question": "Find (-24) mod 7", "options": {"A": "3", "B": "4", "C": "5", "D": "2"}, "answer": "D", "level": "hard"},
{"num": 33, "question": "If a + b ≡ 11 (mod 8) and a ≡ 5 (mod 8), find b mod 8", "options": {"A": "6", "B": "3", "C": "2", "D": "5"}, "answer": "A", "level": "hard"},
{"num": 34, "question": "Find 2^8 mod 15", "options": {"A": "1", "B": "4", "C": "8", "D": "16"}, "answer": "B", "level": "medium"},
{"num": 35, "question": "What is 144 mod 17?", "options": {"A": "8", "B": "9", "C": "11", "D": "13"}, "answer": "B", "level": "easy"},
{"num": 36, "question": "If x ≡ 3 (mod 10) and y ≡ 7 (mod 10), find xy mod 10", "options": {"A": "21", "B": "1", "C": "0", "D": "5"}, "answer": "B", "level": "medium"},
{"num": 37, "question": "Find 11^3 mod 13", "options": {"A": "5", "B": "12", "C": "10", "D": "3"}, "answer": "A", "level": "hard"},
{"num": 38, "question": "What is the remainder when 1000 is divided by 37?", "options": {"A": "1", "B": "12", "C": "25", "D": "30"}, "answer": "C", "level": "hard"},
{"num": 39, "question": "Find (2^7 - 3^3) mod 9", "options": {"A": "2", "B": "4", "C": "6", "D": "7"}, "answer": "A", "level": "hard"},
{"num": 40, "question": "If n ≡ -5 (mod 11), find the smallest positive value of n", "options": {"A": "6", "B": "5", "C": "16", "D": "11"}, "answer": "A", "level": "hard"}
];

let score = 0;
let answered = 0;
const container = document.getElementById('quizContainer');

DATA.forEach((item) => {
  const card = document.createElement('div');
  card.className = 'qcard';

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<span class="qnum">Q${item.num}</span><span class="qtext">${item.question}</span>`;
  card.appendChild(head);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';

  const feedback = document.createElement('div');
  feedback.className = 'feedback';

  ['A','B','C','D'].forEach((letter) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="lab">${letter}</span><span>${item.options[letter]}</span>`;
    btn.addEventListener('click', () => {
      const allBtns = optsWrap.querySelectorAll('.opt');
      allBtns.forEach(b => b.disabled = true);

      if (letter === item.answer) {
        btn.classList.add('is-correct');
        score += 1;
        feedback.textContent = 'Correct!';
        feedback.className = 'feedback show correct';
      } else {
        btn.classList.add('is-wrong');
        allBtns.forEach(b => {
          if (b.textContent.trim().startsWith(item.answer)) b.classList.add('is-correct');
        });
        feedback.textContent = `Not quite. The correct answer is ${item.answer}.`;
        feedback.className = 'feedback show wrong';
      }
      answered += 1;
      updateScoreboard();
    });
    optsWrap.appendChild(btn);
  });

  card.appendChild(optsWrap);
  card.appendChild(feedback);
  container.appendChild(card);
});

const finishWrap = document.createElement('div');
finishWrap.className = 'finish-wrap';
finishWrap.innerHTML = `<button class="finish-btn" id="finishBtn">Submit Exam</button>`;
container.appendChild(finishWrap);

function updateScoreboard(){
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('scoreCount').textContent = score;
  document.getElementById('progressFill').style.width = (answered/40*100) + '%';
}

document.getElementById('finishBtn').addEventListener('click', () => {
  const pct = Math.round((score/40)*100);
  document.getElementById('resultScore').textContent = `${score} / 40`;
  document.getElementById('resultPct').textContent = `${pct}% &mdash; `.replace('&mdash;','—') + (answered < 40 ? `(${40-answered} question(s) left unanswered)` : 'All questions answered');
  let remark;
  if (pct >= 80) remark = "Excellent! You have a strong grasp of Indices.";
  else if (pct >= 60) remark = "Good effort! Review the laws of indices you missed.";
  else if (pct >= 40) remark = "Fair. Go over the topic again, especially fractional and negative indices.";
  else remark = "You need more practice on Indices. Review your notes and try again.";
  document.getElementById('resultRemark').textContent = remark;
  document.getElementById('resultOverlay').classList.add('show');
});
</script>
</body>
</html>
