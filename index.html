<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn With Jay &mdash; Mathematics: Indices Quiz</title>
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#101B33;
    --gold:#C9A227;
    --paper:#FAF8F2;
    --card:#FFFFFF;
    --ink:#22283A;
    --muted:#6B7280;
    --correct:#1E8E5A;
    --correct-bg:#E6F5EC;
    --wrong:#C6432B;
    --wrong-bg:#FBEAE6;
    --line:#E4E0D3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
  }
  .top-bar{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding: 28px 20px 22px;
    text-align:center;
    border-bottom: 4px solid var(--gold);
  }
  .top-bar h1{
    margin:0;
    font-size: 28px;
    letter-spacing: 0.5px;
    font-weight:700;
  }
  .top-bar p{
    margin:6px 0 0;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 13.5px;
    color:#CBD3E1;
  }
  .meta-strip{
    max-width: 760px;
    margin: 18px auto 0;
    padding: 0 20px;
    display:flex;
    flex-wrap:wrap;
    gap: 10px 24px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    justify-content:center;
  }
  .meta-strip span b{ color:var(--navy); }

  .scoreboard{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 18px;
    font-family: Helvetica, Arial, sans-serif;
  }
  .score-pill{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight:600;
    color: var(--navy);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .score-pill span{ color: var(--gold); font-weight:800; }

  .progress-track{
    max-width: 760px;
    margin: 0 auto;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: var(--gold);
    transition: width .25s ease;
  }

  .container{
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 20px 90px;
  }

  .qcard{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(20,20,40,0.05);
  }
  .qhead{
    display:flex;
    align-items:baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .qnum{
    font-family: Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size: 12.5px;
    color: #fff;
    background: var(--navy);
    padding: 3px 9px;
    border-radius: 5px;
    flex-shrink:0;
  }
  .qtext{
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
  }
  .qtext sup{ font-size: 65%; }

  .options{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width:520px){
    .options{ grid-template-columns: 1fr; }
  }
  .opt{
    font-family: Helvetica, Arial, sans-serif;
    text-align:left;
    border: 1.5px solid var(--line);
    background: #FDFCF9;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 10px;
    transition: border-color .15s ease, background .15s ease, transform .08s ease;
    color: var(--ink);
  }
  .opt:hover:not(:disabled){
    border-color: var(--navy);
    transform: translateY(-1px);
  }
  .opt:disabled{ cursor:default; }
  .opt .lab{
    font-weight:700;
    color: var(--navy);
    border: 1.5px solid var(--navy);
    border-radius: 50%;
    width: 22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px;
    flex-shrink:0;
  }
  .opt sup{ font-size: 70%; }
  .opt.is-correct{
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .opt.is-correct .lab{ background:var(--correct); border-color:var(--correct); color:#fff; }
  .opt.is-wrong{
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .opt.is-wrong .lab{ background:var(--wrong); border-color:var(--wrong); color:#fff; }

  .feedback{
    margin-top: 10px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight:600;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ color: var(--correct); }
  .feedback.wrong{ color: var(--wrong); }

  .finish-wrap{
    text-align:center;
    margin-top: 24px;
  }
  .finish-btn{
    font-family: Helvetica, Arial, sans-serif;
    background: var(--navy);
    color:#fff;
    border:none;
    padding: 13px 34px;
    border-radius: 8px;
    font-size: 15px;
    font-weight:700;
    cursor:pointer;
    letter-spacing: 0.3px;
  }
  .finish-btn:disabled{
    background: #A7ADBB;
    cursor:not-allowed;
  }

  .result-overlay{
    position: fixed; inset:0;
    background: rgba(16,27,51,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .result-overlay.show{ display:flex; }
  .result-card{
    background:#fff;
    border-radius: 14px;
    max-width: 420px;
    width:100%;
    padding: 32px 28px;
    text-align:center;
    border-top: 6px solid var(--gold);
  }
  .result-card h2{
    margin: 0 0 4px;
    color: var(--navy);
    font-size: 22px;
  }
  .result-score{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 46px;
    font-weight:800;
    color: var(--navy);
    margin: 14px 0 2px;
  }
  .result-pct{
    font-family: Helvetica, Arial, sans-serif;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .result-remark{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .result-actions button{
    font-family: Helvetica, Arial, sans-serif;
    background: var(--gold);
    color: var(--navy-deep);
    border:none;
    padding: 11px 26px;
    border-radius: 8px;
    font-weight:700;
    cursor:pointer;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <h1>LEARN WITH JAY</h1>
    <p>Excellence in Learning &nbsp;|&nbsp; Building Strong Foundations</p>
  </div>
  <div class="meta-strip">
    <span><b>Class:</b> SS1</span>
    <span><b>Subject:</b> Mathematics</span>
    <span><b>Topic:</b> Indices</span>
    <span><b>Questions:</b> 40</span>
  </div>

  <div class="scoreboard">
    <div class="score-pill">Answered: <span id="answeredCount">0</span>/40</div>
    <div class="score-pill">Score: <span id="scoreCount">0</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="container" id="quizContainer"></div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <h2>Examination Complete</h2>
      <div class="result-score" id="resultScore">0 / 40</div>
      <div class="result-pct" id="resultPct"></div>
      <div class="result-remark" id="resultRemark"></div>
      <div class="result-actions">
        <button onclick="location.reload()">Retake Exam</button>
      </div>
    </div>
  </div>

<script>
const DATA = [
{"num": 1, "question": "A right-angled triangle has shorter sides 3 cm and 4 cm. Find the hypotenuse.", "options": {"A": "7 cm", "B": "5 cm", "C": "6 cm", "D": "25 cm"}, "answer": "B", "level": "easy"},
{"num": 2, "question": "The hypotenuse of a right-angled triangle is 13 cm and one side is 5 cm. Find the third side.", "options": {"A": "8 cm", "B": "10 cm", "C": "12 cm", "D": "14 cm"}, "answer": "C", "level": "easy"},
{"num": 3, "question": "In a right-angled triangle, sin θ is equal to", "options": {"A": "adj/hyp", "B": "opp/adj", "C": "hyp/opp", "D": "opp/hyp"}, "answer": "D", "level": "easy"},
{"num": 4, "question": "cosec θ is equal to", "options": {"A": "1/cos θ", "B": "hyp/adj", "C": "1/sin θ", "D": "adj/opp"}, "answer": "C", "level": "easy"},
{"num": 5, "question": "What is the value of sin 30°?", "options": {"A": "√3/2", "B": "1/√3", "C": "1", "D": "1/2"}, "answer": "D", "level": "easy"},
{"num": 6, "question": "What is the value of tan 60°?", "options": {"A": "1/√3", "B": "√3", "C": "1/2", "D": "√3/2"}, "answer": "B", "level": "easy"},
{"num": 7, "question": "cot θ is equal to", "options": {"A": "opp/adj", "B": "hyp/opp", "C": "adj/opp", "D": "hyp/adj"}, "answer": "C", "level": "easy"},
{"num": 8, "question": "cos 25° is equal to sin of which angle?", "options": {"A": "65°", "B": "25°", "C": "75°", "D": "115°"}, "answer": "A", "level": "easy"},
{"num": 9, "question": "In which quadrant is sine positive and cosine negative?", "options": {"A": "Second", "B": "First", "C": "Third", "D": "Fourth"}, "answer": "A", "level": "easy"},
{"num": 10, "question": "sec θ is equal to", "options": {"A": "hyp/opp", "B": "adj/hyp", "C": "hyp/adj", "D": "opp/adj"}, "answer": "C", "level": "easy"},
{"num": 11, "question": "Triangle ABC is right-angled at B. If AC = 13 cm and AB = 5 cm, find BC.", "options": {"A": "8 cm", "B": "12 cm", "C": "18 cm", "D": "144 cm"}, "answer": "B", "level": "medium"},
{"num": 12, "question": "A 10 m ladder leans against a wall with its foot 6 m from the wall. How high up the wall does it reach?", "options": {"A": "4 m", "B": "16 m", "C": "12 m", "D": "8 m"}, "answer": "D", "level": "medium"},
{"num": 13, "question": "In a right-angled triangle, the side opposite angle y is 10 cm and the hypotenuse is 15 cm. Find y to the nearest degree.", "options": {"A": "35°", "B": "42°", "C": "48°", "D": "56°"}, "answer": "B", "level": "medium"},
{"num": 14, "question": "A right-angled triangle has hypotenuse 9 m and an angle of 64°. Find the side x adjacent to the 64° angle (to 1 d.p.).", "options": {"A": "3.9 m", "B": "8.1 m", "C": "4.4 m", "D": "5.1 m"}, "answer": "A", "level": "medium"},
{"num": 15, "question": "A boy stands 15 m from the base of a tree. The angle of elevation of the top of the tree is 40°. How tall is the tree (to 1 d.p.)?", "options": {"A": "9.6 m", "B": "17.9 m", "C": "12.6 m", "D": "19.6 m"}, "answer": "C", "level": "medium"},
{"num": 16, "question": "From a point 45 m from the foot of a building, the angle of elevation of the roof is 30°. Find the height of the building to the nearest metre.", "options": {"A": "22 m", "B": "26 m", "C": "39 m", "D": "78 m"}, "answer": "B", "level": "medium"},
{"num": 17, "question": "If sin x = 3/5, find cosec x.", "options": {"A": "3/5", "B": "4/3", "C": "5/4", "D": "5/3"}, "answer": "D", "level": "medium"},
{"num": 18, "question": "If tan x = 3/4, find cot x.", "options": {"A": "3/4", "B": "5/4", "C": "4/3", "D": "4/5"}, "answer": "C", "level": "medium"},
{"num": 19, "question": "Express sin 150° as a trigonometric ratio of an acute angle.", "options": {"A": "-sin 30°", "B": "sin 30°", "C": "cos 30°", "D": "-cos 30°"}, "answer": "B", "level": "medium"},
{"num": 20, "question": "What is the value of cos 150°?", "options": {"A": "√3/2", "B": "-1/2", "C": "-√3/2", "D": "1/2"}, "answer": "C", "level": "medium"},
{"num": 21, "question": "What is the value of tan 150°?", "options": {"A": "1/√3", "B": "-1/√3", "C": "-√3", "D": "√3"}, "answer": "B", "level": "medium"},
{"num": 22, "question": "What is the value of sin 210°?", "options": {"A": "√3/2", "B": "1/2", "C": "-1/2", "D": "-√3/2"}, "answer": "C", "level": "medium"},
{"num": 23, "question": "Tangent is positive in which quadrants?", "options": {"A": "1st and 2nd", "B": "2nd and 4th", "C": "1st and 3rd", "D": "3rd and 4th"}, "answer": "C", "level": "medium"},
{"num": 24, "question": "Express sin 120° in terms of an acute angle.", "options": {"A": "-sin 60°", "B": "sin 60°", "C": "sin 30°", "D": "-sin 30°"}, "answer": "B", "level": "medium"},
{"num": 25, "question": "Express cos 120° in terms of an acute angle.", "options": {"A": "cos 60°", "B": "sin 60°", "C": "-sin 60°", "D": "-cos 60°"}, "answer": "D", "level": "medium"},
{"num": 26, "question": "If tan θ = 5/12 and θ is acute, find sin θ.", "options": {"A": "12/13", "B": "5/13", "C": "13/5", "D": "13/12"}, "answer": "B", "level": "hard"},
{"num": 27, "question": "If sin θ = 3/5 and θ is acute, find cos θ + tan θ.", "options": {"A": "7/5", "B": "12/5", "C": "9/20", "D": "31/20"}, "answer": "D", "level": "hard"},
{"num": 28, "question": "Evaluate sin 30° cos 60° + cos 30° sin 60°.", "options": {"A": "1/2", "B": "√3/2", "C": "1", "D": "3/4"}, "answer": "C", "level": "hard"},
{"num": 29, "question": "Evaluate cos 30° × tan 60°.", "options": {"A": "3/2", "B": "1/2", "C": "√3/2", "D": "3/4"}, "answer": "A", "level": "hard"},
{"num": 30, "question": "Evaluate cosec 30° + sec 60°.", "options": {"A": "2", "B": "4", "C": "3", "D": "1/2"}, "answer": "B", "level": "hard"},
{"num": 31, "question": "A kite string 20 m long is taut and makes an angle of elevation of 60° with the ground. How high is the kite (to 1 d.p.)?", "options": {"A": "10 m", "B": "11.5 m", "C": "34.6 m", "D": "17.3 m"}, "answer": "D", "level": "hard"},
{"num": 32, "question": "A 6 m ladder leans against a wall and makes an angle of 60° with the ground. How far is the foot of the ladder from the wall?", "options": {"A": "3 m", "B": "5.2 m", "C": "6 m", "D": "10.4 m"}, "answer": "A", "level": "hard"},
{"num": 33, "question": "A man stands 30 m from a building. The angle of elevation of the top of the building is 60°. Find the height of the building to the nearest metre.", "options": {"A": "17 m", "B": "30 m", "C": "52 m", "D": "60 m"}, "answer": "C", "level": "hard"},
{"num": 34, "question": "The angle of elevation of the top of a pole from a point 12 m away on level ground is 35°. Find the height of the pole (to 1 d.p.).", "options": {"A": "6.9 m", "B": "8.4 m", "C": "9.8 m", "D": "17.1 m"}, "answer": "B", "level": "hard"},
{"num": 35, "question": "If tan θ = 1.5, find θ to 1 decimal place.", "options": {"A": "33.7°", "B": "48.2°", "C": "60.0°", "D": "56.3°"}, "answer": "D", "level": "hard"},
{"num": 36, "question": "In a right-angled triangle, the side adjacent to angle m is 3.5 cm and the hypotenuse is 5.8 cm. Find m to the nearest degree.", "options": {"A": "37°", "B": "42°", "C": "53°", "D": "60°"}, "answer": "C", "level": "hard"},
{"num": 37, "question": "A right-angled triangle has hypotenuse 25 cm and one side 7 cm. Find the sine of the angle opposite the other side.", "options": {"A": "7/25", "B": "24/25", "C": "25/24", "D": "7/24"}, "answer": "B", "level": "hard"},
{"num": 38, "question": "If sin 3x = cos (2x + 10°), where both angles are acute, find x.", "options": {"A": "16°", "B": "20°", "C": "14°", "D": "18°"}, "answer": "A", "level": "hard"},
{"num": 39, "question": "In which quadrant is cos θ negative and tan θ positive?", "options": {"A": "1st", "B": "2nd", "C": "3rd", "D": "4th"}, "answer": "C", "level": "hard"},
{"num": 40, "question": "Evaluate sin 150° + cos 150°.", "options": {"A": "(1 + √3)/2", "B": "(1 − √3)/2", "C": "(√3 − 1)/2", "D": "-(1 + √3)/2"}, "answer": "B", "level": "hard"}
];

let score = 0;
let answered = 0;
const container = document.getElementById('quizContainer');

DATA.forEach((item) => {
  const card = document.createElement('div');
  card.className = 'qcard';

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<span class="qnum">Q${item.num}</span><span class="qtext">${item.question}</span>`;
  card.appendChild(head);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';

  const feedback = document.createElement('div');
  feedback.className = 'feedback';

  ['A','B','C','D'].forEach((letter) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="lab">${letter}</span><span>${item.options[letter]}</span>`;
    btn.addEventListener('click', () => {
      const allBtns = optsWrap.querySelectorAll('.opt');
      allBtns.forEach(b => b.disabled = true);

      if (letter === item.answer) {
        btn.classList.add('is-correct');
        score += 1;
        feedback.textContent = 'Correct!';
        feedback.className = 'feedback show correct';
      } else {
        btn.classList.add('is-wrong');
        allBtns.forEach(b => {
          if (b.textContent.trim().startsWith(item.answer)) b.classList.add('is-correct');
        });
        feedback.textContent = `Not quite. The correct answer is ${item.answer}.`;
        feedback.className = 'feedback show wrong';
      }
      answered += 1;
      updateScoreboard();
    });
    optsWrap.appendChild(btn);
  });

  card.appendChild(optsWrap);
  card.appendChild(feedback);
  container.appendChild(card);
});

const finishWrap = document.createElement('div');
finishWrap.className = 'finish-wrap';
finishWrap.innerHTML = `<button class="finish-btn" id="finishBtn">Submit Exam</button>`;
container.appendChild(finishWrap);

function updateScoreboard(){
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('scoreCount').textContent = score;
  document.getElementById('progressFill').style.width = (answered/40*100) + '%';
}

document.getElementById('finishBtn').addEventListener('click', () => {
  const pct = Math.round((score/40)*100);
  document.getElementById('resultScore').textContent = `${score} / 40`;
  document.getElementById('resultPct').textContent = `${pct}% &mdash; `.replace('&mdash;','—') + (answered < 40 ? `(${40-answered} question(s) left unanswered)` : 'All questions answered');
  let remark;
  if (pct >= 80) remark = "Excellent! You have a strong grasp of Indices.";
  else if (pct >= 60) remark = "Good effort! Review the laws of indices you missed.";
  else if (pct >= 40) remark = "Fair. Go over the topic again, especially fractional and negative indices.";
  else remark = "You need more practice on Indices. Review your notes and try again.";
  document.getElementById('resultRemark').textContent = remark;
  document.getElementById('resultOverlay').classList.add('show');
});
</script>
</body>
</html>
