<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn With Jay &mdash; Mathematics: Indices Quiz</title>
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#101B33;
    --gold:#C9A227;
    --paper:#FAF8F2;
    --card:#FFFFFF;
    --ink:#22283A;
    --muted:#6B7280;
    --correct:#1E8E5A;
    --correct-bg:#E6F5EC;
    --wrong:#C6432B;
    --wrong-bg:#FBEAE6;
    --line:#E4E0D3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
  }
  .top-bar{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding: 28px 20px 22px;
    text-align:center;
    border-bottom: 4px solid var(--gold);
  }
  .top-bar h1{
    margin:0;
    font-size: 28px;
    letter-spacing: 0.5px;
    font-weight:700;
  }
  .top-bar p{
    margin:6px 0 0;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 13.5px;
    color:#CBD3E1;
  }
  .meta-strip{
    max-width: 760px;
    margin: 18px auto 0;
    padding: 0 20px;
    display:flex;
    flex-wrap:wrap;
    gap: 10px 24px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    justify-content:center;
  }
  .meta-strip span b{ color:var(--navy); }

  .scoreboard{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 18px;
    font-family: Helvetica, Arial, sans-serif;
  }
  .score-pill{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight:600;
    color: var(--navy);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .score-pill span{ color: var(--gold); font-weight:800; }

  .progress-track{
    max-width: 760px;
    margin: 0 auto;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: var(--gold);
    transition: width .25s ease;
  }

  .container{
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 20px 90px;
  }

  .qcard{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(20,20,40,0.05);
  }
  .qhead{
    display:flex;
    align-items:baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .qnum{
    font-family: Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size: 12.5px;
    color: #fff;
    background: var(--navy);
    padding: 3px 9px;
    border-radius: 5px;
    flex-shrink:0;
  }
  .qtext{
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
  }
  .qtext sup{ font-size: 65%; }

  .options{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width:520px){
    .options{ grid-template-columns: 1fr; }
  }
  .opt{
    font-family: Helvetica, Arial, sans-serif;
    text-align:left;
    border: 1.5px solid var(--line);
    background: #FDFCF9;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 10px;
    transition: border-color .15s ease, background .15s ease, transform .08s ease;
    color: var(--ink);
  }
  .opt:hover:not(:disabled){
    border-color: var(--navy);
    transform: translateY(-1px);
  }
  .opt:disabled{ cursor:default; }
  .opt .lab{
    font-weight:700;
    color: var(--navy);
    border: 1.5px solid var(--navy);
    border-radius: 50%;
    width: 22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px;
    flex-shrink:0;
  }
  .opt sup{ font-size: 70%; }
  .opt.is-correct{
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .opt.is-correct .lab{ background:var(--correct); border-color:var(--correct); color:#fff; }
  .opt.is-wrong{
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .opt.is-wrong .lab{ background:var(--wrong); border-color:var(--wrong); color:#fff; }

  .feedback{
    margin-top: 10px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight:600;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ color: var(--correct); }
  .feedback.wrong{ color: var(--wrong); }

  .finish-wrap{
    text-align:center;
    margin-top: 24px;
  }
  .finish-btn{
    font-family: Helvetica, Arial, sans-serif;
    background: var(--navy);
    color:#fff;
    border:none;
    padding: 13px 34px;
    border-radius: 8px;
    font-size: 15px;
    font-weight:700;
    cursor:pointer;
    letter-spacing: 0.3px;
  }
  .finish-btn:disabled{
    background: #A7ADBB;
    cursor:not-allowed;
  }

  .result-overlay{
    position: fixed; inset:0;
    background: rgba(16,27,51,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .result-overlay.show{ display:flex; }
  .result-card{
    background:#fff;
    border-radius: 14px;
    max-width: 420px;
    width:100%;
    padding: 32px 28px;
    text-align:center;
    border-top: 6px solid var(--gold);
  }
  .result-card h2{
    margin: 0 0 4px;
    color: var(--navy);
    font-size: 22px;
  }
  .result-score{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 46px;
    font-weight:800;
    color: var(--navy);
    margin: 14px 0 2px;
  }
  .result-pct{
    font-family: Helvetica, Arial, sans-serif;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .result-remark{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .result-actions button{
    font-family: Helvetica, Arial, sans-serif;
    background: var(--gold);
    color: var(--navy-deep);
    border:none;
    padding: 11px 26px;
    border-radius: 8px;
    font-weight:700;
    cursor:pointer;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <h1>LEARN WITH JAY</h1>
    <p>Excellence in Learning &nbsp;|&nbsp; Building Strong Foundations</p>
  </div>
  <div class="meta-strip">
    <span><b>Class:</b> SS1</span>
    <span><b>Subject:</b> Mathematics</span>
    <span><b>Topic:</b> Indices</span>
    <span><b>Questions:</b> 40</span>
  </div>

  <div class="scoreboard">
    <div class="score-pill">Answered: <span id="answeredCount">0</span>/40</div>
    <div class="score-pill">Score: <span id="scoreCount">0</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="container" id="quizContainer"></div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <h2>Examination Complete</h2>
      <div class="result-score" id="resultScore">0 / 40</div>
      <div class="result-pct" id="resultPct"></div>
      <div class="result-remark" id="resultRemark"></div>
      <div class="result-actions">
        <button onclick="location.reload()">Retake Exam</button>
      </div>
    </div>
  </div>

<script>
const DATA = [
{"num": 1, "question": "Find x if 2<sup>(x+3)</sup> = 2<sup>(2x-1)</sup>", "options": {"A": "4", "B": "2", "C": "5", "D": "3"}, "answer": "A", "level": "hard"},
{"num": 2, "question": "Find x if 5<sup>(2x-3)</sup> = 5<sup>(x+2)</sup>", "options": {"A": "1", "B": "5", "C": "3", "D": "-5"}, "answer": "B", "level": "hard"},
{"num": 3, "question": "Simplify: (a<sup>4</sup>b<sup>-2</sup>)<sup>-3</sup>", "options": {"A": "a<sup>12</sup>b<sup>-6</sup>", "B": "b<sup>6</sup>/a<sup>12</sup>", "C": "a<sup>-12</sup>b<sup>-6</sup>", "D": "a<sup>12</sup>/b<sup>6</sup>"}, "answer": "B", "level": "hard"},
{"num": 4, "question": "Simplify: (2<sup>-2</sup>)<sup>-3</sup>", "options": {"A": "64", "B": "1/64", "C": "8", "D": "-64"}, "answer": "A", "level": "hard"},
{"num": 5, "question": "Evaluate: 8<sup>-2/3</sup>", "options": {"A": "4", "B": "1/4", "C": "-4", "D": "2"}, "answer": "B", "level": "hard"},
{"num": 6, "question": "Evaluate: 27<sup>-2/3</sup>", "options": {"A": "9", "B": "1/3", "C": "1/9", "D": "3"}, "answer": "C", "level": "hard"},
{"num": 7, "question": "Find x if 9<sup>x</sup> = 27<sup>(x-1)</sup>", "options": {"A": "2", "B": "6", "C": "3", "D": "-3"}, "answer": "C", "level": "hard"},
{"num": 8, "question": "Simplify: (x<sup>2</sup>y<sup>3</sup>)<sup>-2</sup> \u00f7 (x<sup>-1</sup>y)<sup>3</sup>", "options": {"A": "1/(xy<sup>9</sup>)", "B": "xy<sup>9</sup>", "C": "1/(x<sup>7</sup>y<sup>3</sup>)", "D": "x<sup>7</sup>y<sup>-9</sup>"}, "answer": "A", "level": "hard"},
{"num": 9, "question": "Find x if 4<sup>x</sup> = 2<sup>(x+6)</sup>", "options": {"A": "3", "B": "12", "C": "6", "D": "2"}, "answer": "C", "level": "hard"},
{"num": 10, "question": "Simplify: (m<sup>3</sup>n<sup>-1</sup>)<sup>2</sup> \u00f7 (m<sup>-2</sup>n<sup>3</sup>)<sup>-1</sup>", "options": {"A": "m<sup>4</sup>n", "B": "m<sup>8</sup>n<sup>-5</sup>", "C": "m<sup>4</sup>n<sup>-5</sup>", "D": "m<sup>8</sup>n"}, "answer": "A", "level": "hard"},
{"num": 11, "question": "Evaluate: (81/16)<sup>1/4</sup>", "options": {"A": "3/2", "B": "9/4", "C": "2/3", "D": "4/3"}, "answer": "A", "level": "hard"},
{"num": 12, "question": "Evaluate: (8/27)<sup>-2/3</sup>", "options": {"A": "4/9", "B": "9/4", "C": "2/3", "D": "3/2"}, "answer": "B", "level": "hard"},
{"num": 13, "question": "Find x if 3<sup>x\u00b2</sup> = 3<sup>(4x-3)</sup>", "options": {"A": "x = 1 or x = 3", "B": "x = -1 or x = -3", "C": "x = 2 only", "D": "x = 1 or x = -3"}, "answer": "A", "level": "hard"},
{"num": 14, "question": "Simplify: (2<sup>n</sup> \u00d7 2<sup>(n+1)</sup>) \u00f7 2<sup>(2n-1)</sup>", "options": {"A": "2", "B": "4", "C": "2<sup>n</sup>", "D": "8"}, "answer": "B", "level": "hard"},
{"num": 15, "question": "Simplify: (a<sup>1/2</sup> \u00d7 a<sup>1/3</sup>) \u00f7 a<sup>1/6</sup>", "options": {"A": "a<sup>2/3</sup>", "B": "a<sup>5/6</sup>", "C": "a<sup>1/3</sup>", "D": "a"}, "answer": "A", "level": "hard"},
{"num": 16, "question": "Evaluate: 2<sup>3</sup> \u00d7 2<sup>-5</sup> \u00d7 2<sup>4</sup>", "options": {"A": "2", "B": "4", "C": "8", "D": "1"}, "answer": "B", "level": "hard"},
{"num": 17, "question": "Find x if (1/4)<sup>x</sup> = 32", "options": {"A": "-5/2", "B": "5/2", "C": "-2/5", "D": "2/5"}, "answer": "A", "level": "hard"},
{"num": 18, "question": "Simplify: (x<sup>-2</sup>y<sup>3</sup>)<sup>-2</sup> \u00d7 (x<sup>3</sup>y<sup>-1</sup>)<sup>2</sup>", "options": {"A": "x<sup>10</sup>/y<sup>8</sup>", "B": "x<sup>-10</sup>y<sup>8</sup>", "C": "x<sup>2</sup>/y<sup>8</sup>", "D": "x<sup>10</sup>y<sup>8</sup>"}, "answer": "A", "level": "hard"},
{"num": 19, "question": "Evaluate: 5<sup>2</sup> \u00d7 5<sup>-4</sup> \u00f7 5<sup>-3</sup>", "options": {"A": "5", "B": "1/5", "C": "25", "D": "1"}, "answer": "A", "level": "hard"},
{"num": 20, "question": "Find x if 16<sup>x</sup> = 8<sup>(x+1)</sup>", "options": {"A": "4", "B": "3", "C": "1", "D": "12"}, "answer": "B", "level": "hard"},
{"num": 21, "question": "Simplify: (2a<sup>2</sup>)<sup>3</sup> \u00f7 (4a<sup>3</sup>)", "options": {"A": "2a<sup>3</sup>", "B": "4a<sup>3</sup>", "C": "2a<sup>6</sup>", "D": "8a<sup>3</sup>"}, "answer": "A", "level": "hard"},
{"num": 22, "question": "Evaluate: (1/2)<sup>-3</sup> \u00f7 (1/4)<sup>-1</sup>", "options": {"A": "2", "B": "4", "C": "1/2", "D": "32"}, "answer": "A", "level": "hard"},
{"num": 23, "question": "Find x if 2<sup>3x</sup> \u00f7 2<sup>x</sup> = 2<sup>8</sup>", "options": {"A": "2", "B": "4", "C": "8", "D": "16"}, "answer": "B", "level": "hard"},
{"num": 24, "question": "Simplify: (p<sup>1/3</sup>q<sup>1/2</sup>)<sup>6</sup>", "options": {"A": "p<sup>2</sup>q<sup>3</sup>", "B": "p<sup>3</sup>q<sup>2</sup>", "C": "p<sup>6</sup>q<sup>6</sup>", "D": "p<sup>2</sup>q<sup>6</sup>"}, "answer": "A", "level": "hard"},
{"num": 25, "question": "Evaluate: 9<sup>3/2</sup>", "options": {"A": "27", "B": "18", "C": "81", "D": "9"}, "answer": "A", "level": "hard"},
{"num": 26, "question": "Evaluate: 4<sup>5/2</sup>", "options": {"A": "16", "B": "32", "C": "64", "D": "8"}, "answer": "B", "level": "hard"},
{"num": 27, "question": "Find x if 25<sup>x</sup> = 125", "options": {"A": "3/2", "B": "2/3", "C": "3", "D": "5/2"}, "answer": "A", "level": "hard"},
{"num": 28, "question": "Simplify: (x<sup>a</sup>)<sup>b</sup> \u00f7 x<sup>(ab-1)</sup>", "options": {"A": "x", "B": "x<sup>ab</sup>", "C": "1", "D": "x<sup>-1</sup>"}, "answer": "A", "level": "hard"},
{"num": 29, "question": "Evaluate: (2<sup>-1</sup> + 2<sup>-2</sup>)<sup>-1</sup>", "options": {"A": "3/4", "B": "4/3", "C": "3", "D": "4"}, "answer": "B", "level": "hard"},
{"num": 30, "question": "Simplify: 16<sup>1/2</sup> \u00d7 4<sup>-1/2</sup>", "options": {"A": "2", "B": "8", "C": "1", "D": "4"}, "answer": "A", "level": "hard"},
{"num": 31, "question": "Find x if 3<sup>(2x+1)</sup> = 27<sup>(x-1)</sup>", "options": {"A": "2", "B": "4", "C": "-4", "D": "1"}, "answer": "B", "level": "hard"},
{"num": 32, "question": "Simplify: (a<sup>2</sup>b<sup>-3</sup>)<sup>-1</sup> \u00d7 (a<sup>-1</sup>b<sup>2</sup>)<sup>2</sup>", "options": {"A": "b<sup>7</sup>/a<sup>4</sup>", "B": "a<sup>4</sup>/b<sup>7</sup>", "C": "a<sup>4</sup>b<sup>7</sup>", "D": "b<sup>7</sup>/a<sup>2</sup>"}, "answer": "A", "level": "hard"},
{"num": 33, "question": "Evaluate: 8<sup>0</sup> + 2<sup>-3</sup>", "options": {"A": "9/8", "B": "1/8", "C": "8", "D": "9"}, "answer": "A", "level": "hard"},
{"num": 34, "question": "Find x if 2<sup>x</sup> + 2<sup>x</sup> = 2<sup>5</sup>", "options": {"A": "5", "B": "4", "C": "2", "D": "6"}, "answer": "B", "level": "hard"},
{"num": 35, "question": "Simplify: (x<sup>2</sup>)<sup>-1</sup> \u00d7 (x<sup>-3</sup>)<sup>-2</sup>", "options": {"A": "x<sup>4</sup>", "B": "x<sup>-4</sup>", "C": "x<sup>8</sup>", "D": "x<sup>-8</sup>"}, "answer": "A", "level": "hard"},
{"num": 36, "question": "Evaluate: (27<sup>2/3</sup> \u00d7 9<sup>1/2</sup>) \u00f7 3<sup>2</sup>", "options": {"A": "3", "B": "9", "C": "27", "D": "1"}, "answer": "A", "level": "hard"},
{"num": 37, "question": "Find x if 5<sup>(x-1)</sup> \u00d7 5<sup>2</sup> = 5<sup>7</sup>", "options": {"A": "6", "B": "4", "C": "8", "D": "10"}, "answer": "A", "level": "hard"},
{"num": 38, "question": "Simplify: (m<sup>-1</sup>n<sup>2</sup>)<sup>3</sup> \u00f7 (m<sup>2</sup>n<sup>-1</sup>)<sup>-2</sup>", "options": {"A": "mn<sup>4</sup>", "B": "m<sup>-1</sup>n<sup>4</sup>", "C": "m<sup>7</sup>n<sup>4</sup>", "D": "m<sup>-7</sup>n<sup>8</sup>"}, "answer": "A", "level": "hard"},
{"num": 39, "question": "Evaluate: (1/9)<sup>-1/2</sup>", "options": {"A": "3", "B": "1/3", "C": "9", "D": "-3"}, "answer": "A", "level": "hard"},
{"num": 40, "question": "Find x if 4<sup>(2x-1)</sup> = 2<sup>(x+5)</sup>", "options": {"A": "7/3", "B": "3", "C": "7/4", "D": "3/7"}, "answer": "A", "level": "hard"}
];

let score = 0;
let answered = 0;
const container = document.getElementById('quizContainer');

DATA.forEach((item) => {
  const card = document.createElement('div');
  card.className = 'qcard';

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<span class="qnum">Q${item.num}</span><span class="qtext">${item.question}</span>`;
  card.appendChild(head);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';

  const feedback = document.createElement('div');
  feedback.className = 'feedback';

  ['A','B','C','D'].forEach((letter) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="lab">${letter}</span><span>${item.options[letter]}</span>`;
    btn.addEventListener('click', () => {
      const allBtns = optsWrap.querySelectorAll('.opt');
      allBtns.forEach(b => b.disabled = true);

      if (letter === item.answer) {
        btn.classList.add('is-correct');
        score += 1;
        feedback.textContent = 'Correct!';
        feedback.className = 'feedback show correct';
      } else {
        btn.classList.add('is-wrong');
        allBtns.forEach(b => {
          if (b.textContent.trim().startsWith(item.answer)) b.classList.add('is-correct');
        });
        feedback.textContent = `Not quite. The correct answer is ${item.answer}.`;
        feedback.className = 'feedback show wrong';
      }
      answered += 1;
      updateScoreboard();
    });
    optsWrap.appendChild(btn);
  });

  card.appendChild(optsWrap);
  card.appendChild(feedback);
  container.appendChild(card);
});

const finishWrap = document.createElement('div');
finishWrap.className = 'finish-wrap';
finishWrap.innerHTML = `<button class="finish-btn" id="finishBtn">Submit Exam</button>`;
container.appendChild(finishWrap);

function updateScoreboard(){
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('scoreCount').textContent = score;
  document.getElementById('progressFill').style.width = (answered/40*100) + '%';
}

document.getElementById('finishBtn').addEventListener('click', () => {
  const pct = Math.round((score/40)*100);
  document.getElementById('resultScore').textContent = `${score} / 40`;
  document.getElementById('resultPct').textContent = `${pct}% &mdash; `.replace('&mdash;','—') + (answered < 40 ? `(${40-answered} question(s) left unanswered)` : 'All questions answered');
  let remark;
  if (pct >= 80) remark = "Excellent! You have a strong grasp of Indices.";
  else if (pct >= 60) remark = "Good effort! Review the laws of indices you missed.";
  else if (pct >= 40) remark = "Fair. Go over the topic again, especially fractional and negative indices.";
  else remark = "You need more practice on Indices. Review your notes and try again.";
  document.getElementById('resultRemark').textContent = remark;
  document.getElementById('resultOverlay').classList.add('show');
});
</script>
</body>
</html>
